<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linktree</title>
<style>
  /* Tema 3: warm editorial charcoal. Bedang dari versi krem (v1) dan gelap hangam (v2).
     Palette (R-29): charcoal dasar + off-white + satu aksen amber. Netral tidak dihitung. */
  :root {
    --bg: #121010;
    --card: #1c1a1a;
    --text: #eaddd4;
    --text-muted: #a89a8f;
    --accent: #e8a35d;
    --border: #33302d;
    --radius-card: 26px;
    --radius-btn: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    font-size: clamp(14px, 1.2vw, 17px);
    line-height: 1.5;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
  }

  .card {
    background: var(--card);
    width: 100%;
    max-width: 380px;
    padding: 46px 28px 54px;
    border-radius: var(--radius-card);
    border: 1px solid var(--border);
    text-align: center;
    /* R-12: shadow hanya sebagai penanda elevasi pada kartu utama, bukan semua elemen. */
    box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.45);
  }

  .accent-rule {
    width: 36px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin: 0 auto 18px;
  }

  .avatar {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--accent);
    margin: 0 auto 20px;
    display: block;
    box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.35);
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 38px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link {
    display: block;
    padding: 16px 20px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    text-align: center;
    /* R-03: target sentuh minimal 44x44 px via padding + ukuran font. */
    min-height: 52px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .link:active { background: #262322; }

  .link:hover { border-color: #554f4a; }

  .link.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #121010;
    font-weight: 600;
  }

  .link.primary:active { background: #d8904c; }

  .foot {
    margin-top: 38px;
    color: var(--text-muted);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
  }

  /* R-03: state mobile berbeda (kolom tunggal, kartu pusat). Layar lebar: kartu
     tetap terbatas agar tidak meregang ke tepi layar. */
  @media (min-width: 480px) {
    body { padding: 32px 24px; }
    .card { padding: 54px 36px 62px; max-width: 420px; }
    .accent-rule { width: 44px; margin-bottom: 22px; }
    .avatar { width: 122px; height: 122px; margin-bottom: 24px; }
    h1 { font-size: 1.75rem; }
    .sub { font-size: 1rem; margin-bottom: 44px; }
    .link { min-height: 56px; padding: 18px 22px; font-size: 1.05rem; }
  }
</style>
</head>
<body>

<main class="card">
  <div class="accent-rule"></div>
  <img src="profile.jpg" alt="Foto profil" class="avatar">
  <h1>Linktree</h1>
  <p class="sub">GC K-DRAMA &middot; TikTok &middot; Order APK Prem</p>

  <nav class="links">
    <a href="https://chat.whatsapp.com/DaouXDmwj6WJvvg99E143G?s=cl&amp;p=i&amp;mlu=4&amp;ilr=4&amp;iam=2" class="link">GC K-DRAMA (WhatsApp)</a>
    <a href="https://www.tiktok.com/@bhyonna6?_r=1&amp;_t=ZS-9AyQGUXedxV" class="link">TikTok @bhyonna6</a>
    <a href="https://bhyon-d94b.vercel.app/" class="link primary">Order APK Prem</a>
  </nav>

  <p class="foot">Buka tautan yang ingin Anda kunjungi.</p>
</main>

</body>
</html>
